# Local development stack for Part 3.
# Currently: Redis + the news feeder. Worker / signal / postgres land here as
# we build them (commented stubs below show where).
#
#   docker compose up --build        # start redis + feeder
#   docker compose logs -f feeder    # watch articles flow
#   docker compose down              # stop (add -v to also wipe redis data)

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      # localhost only — never expose Redis to the network (no auth by default)
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  feeder:
    build:
      context: .
      target: feeder
    environment:
      REDIS_URL: redis://redis:6379/0
      POLL_INTERVAL_SECONDS: "60"
      FRESHNESS_WINDOW_MINUTES: "30"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # SINGLETON — more than one poller = duplicate fetches. Do not scale.
    deploy:
      replicas: 1

  postgres:      # relational state + pgvector (vector search) in one
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema is NOT applied here anymore: initdb scripts run only on a fresh
      # volume, so they couldn't evolve an existing DB. The `migrate` service
      # below applies db/migrations/ against the live DB on every startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:       # ONE-SHOT: applies db/migrations/ then exits (0 = success)
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://pm:pm@postgres:5432/pm
    depends_on:
      postgres:
        condition: service_healthy
    # No restart: this runs to completion once per `up`; worker/syncer wait on it.
    restart: "no"

  worker:        # SCALABLE: docker compose up --scale worker=3
    build:
      context: .
      target: worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://pm:pm@postgres:5432/pm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      AUDIT_LOG_PATH: /data/belief_updates.jsonl
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - audit_logs:/data

  syncer:        # SINGLETON: market ingestion (fetch + embed + prune)
    build:
      context: .
      target: syncer
    environment:
      DATABASE_URL: postgresql://pm:pm@postgres:5432/pm
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS}
      RESOLUTION_WINDOW_DAYS: ${RESOLUTION_WINDOW_DAYS}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # SINGLETON — more than one syncer = duplicate Gamma fetches. Do not scale.
    deploy:
      replicas: 1

  scorer:        # SINGLETON: grades resolved markets (closes the loop)
    build:
      context: .
      target: scorer
    environment:
      DATABASE_URL: postgresql://pm:pm@postgres:5432/pm
      SCORER_INTERVAL_SECONDS: ${SCORER_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # SINGLETON — scoring is idempotent, so a second instance just duplicates work.
    deploy:
      replicas: 1

  prometheus:    # scrapes /metrics from feeder/worker/syncer/scorer over the internal network
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # localhost only — the metrics UI is not exposed to the network
      - "127.0.0.1:9090:9090"
    depends_on:
      - feeder
      - worker
      - syncer
      - scorer
    restart: unless-stopped

  grafana:       # dashboards; datasource + Pipeline dashboard are provisioned on startup
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # localhost only — view at http://127.0.0.1:3000 (or via SSH tunnel in prod)
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- added later ---
  # signal:        # SINGLETON: mutates positions, do not scale
  #   build: { context: ., target: signal }
  #   deploy: { replicas: 1 }

volumes:
  redis_data:
  pg_data:
  audit_logs:
  prometheus_data:
  grafana_data:
